name: verify and browser checks
on:
  push:
    branches: [main, 'codex-*', 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Optional served URL for release acceptance'
        required: false
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser checks
        env:
          RULEBREAKER_E2E_BASE_URL: ${{ inputs.deployment_url }}
          RULEBREAKER_E2E_EXPECTED_REVISION: ${{ inputs.deployment_url && github.sha || '' }}
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload browser traces and videos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
